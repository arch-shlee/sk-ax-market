<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>앱 찾기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#111111;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #111111">

<header style="border-bottom: 1px solid #EAEAEA">
  <div style="max-width: 1200px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 40px">
    <a href="Main.dc.html" style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; min-height: 44px; display: flex; align-items: center">AX App Market</a>
    <nav aria-label="주 메뉴" style="display: flex; gap: 28px">
      <a href="Main.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 0; border-bottom: 2px solid #111111">앱 찾기</a>
      <a href="MyApps.dc.html" style="font-size: 14px; color: #6B6B6B; text-decoration: none; padding: 12px 0; border-bottom: 2px solid transparent">내 앱</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
      <a href="Register.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #D4D4D4; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none">앱 등록</a>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">홍</span>
    </div>
  </div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 72px 32px 96px; display: flex; flex-direction: column; gap: 56px">

  <section style="display: flex; flex-direction: column; gap: 24px; max-width: 760px">
    <h1 style="margin: 0; font-size: 36px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">필요한 업무 앱을 찾아<br>바로 실행하세요</h1>
    <form role="search" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 18px; border: 1px solid #D4D4D4; border-radius: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">앱 검색</label>
      <input id="q" type="search" placeholder="앱 이름이나 업무로 검색" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: none; font: inherit; font-size: 16px; color: #111111; background: transparent">
      <button type="submit" style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: #111111; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">검색</button>
    </form>
  </section>

  <section aria-labelledby="list" style="display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 1px solid #EAEAEA">
      <div role="tablist" aria-label="업무 분야" style="display: flex; flex-wrap: wrap; gap: 24px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
          <sc-if value="{{c.active}}" hint-placeholder-val="{{false}}">
            <button role="tab" aria-selected="true" onClick="{{c.pick}}" style="height: 44px; padding: 0; margin-bottom: -1px; border: 0; border-bottom: 2px solid #111111; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #111111; cursor: pointer">{{c.label}}</button>
          </sc-if>
          <sc-if value="{{c.idle}}" hint-placeholder-val="{{true}}">
            <button role="tab" aria-selected="false" onClick="{{c.pick}}" style="height: 44px; padding: 0; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: transparent; font: inherit; font-size: 15px; color: #6B6B6B; cursor: pointer">{{c.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <h2 id="list" style="margin: 0 0 12px; font-size: 13px; font-weight: 400; color: #6B6B6B">앱 {{count}}개</h2>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="6">
        <article style="border: 1px solid #EAEAEA; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="flex: none; width: 44px; height: 44px; border-radius: 10px; background: #F2F2F2; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">{{a.glyph}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <a href="AppDetail.dc.html" style="font-size: 16px; font-weight: 600; text-decoration: none; letter-spacing: -0.01em">{{a.name}}</a>
              <span style="font-size: 13px; color: #6B6B6B">{{a.org}}</span>
            </div>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #444444; min-height: 44px">{{a.desc}}</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <span style="font-size: 13px; color: #6B6B6B">{{a.cat}}</span>
            <sc-if value="{{a.open}}" hint-placeholder-val="{{true}}">
              <a href="AppDetail.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">실행</a>
            </sc-if>
            <sc-if value="{{a.locked}}" hint-placeholder-val="{{false}}">
              <a href="AppDetail.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; border: 1px solid #D4D4D4; font-size: 13px; font-weight: 500; text-decoration: none">권한 신청</a>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </div>
  </section>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: '전체' };
  }
  renderVals() {
    const all = [
      { name: '설비 이상 조회', glyph: '설', org: '설비기술팀', cat: '제조', desc: 'MES 설비 로그에서 이상 징후를 찾아 설비별로 보여줍니다.', open: true },
      { name: '품질 불량 분석', glyph: '품', org: '품질혁신팀', cat: '품질', desc: '공정별 불량 유형과 추이를 한 화면에서 비교합니다.', open: true },
      { name: '구매 단가 비교', glyph: '구', org: '구매전략팀', cat: '구매', desc: '품목별 견적 이력과 시장 단가를 비교합니다.', locked: true },
      { name: '영업 실적 요약', glyph: '영', org: '영업기획팀', cat: '영업', desc: '주간 영업 실적과 목표 대비 진척을 요약합니다.', open: true },
      { name: '월마감 체크리스트', glyph: '월', org: '재무회계팀', cat: '재무', desc: '마감 항목의 진행 현황을 부서별로 추적합니다.', open: true },
      { name: '교육 이수 현황', glyph: '교', org: '인재개발팀', cat: '인사', desc: '부서원의 필수 교육 이수 상태를 확인합니다.', locked: true }
    ];
    const cat = this.state.cat;
    const cats = ['전체', '제조', '품질', '구매', '영업', '재무', '인사'].map((label) => ({
      label, active: cat === label, idle: cat !== label, pick: () => this.setState({ cat: label })
    }));
    const apps = cat === '전체' ? all : all.filter((a) => a.cat === cat);
    return { cats, apps, count: apps.length };
  }
}
</script>
</body>
</html>
