<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 앱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#111111;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #111111">

<header style="border-bottom: 1px solid #EAEAEA">
  <div style="max-width: 1200px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 40px">
    <a href="Main.dc.html" style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; min-height: 44px; display: flex; align-items: center">AX App Market</a>
    <nav aria-label="주 메뉴" style="display: flex; gap: 28px">
      <a href="Main.dc.html" style="font-size: 14px; color: #6B6B6B; text-decoration: none; padding: 12px 0; border-bottom: 2px solid transparent">앱 찾기</a>
      <a href="MyApps.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 0; border-bottom: 2px solid #111111">내 앱</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
      <a href="Register.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #D4D4D4; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none">앱 등록</a>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">홍</span>
    </div>
  </div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.025em">내 앱</h1>
      <p style="margin: 0; font-size: 15px; color: #6B6B6B">내가 등록한 앱과 진행 상황입니다.</p>
    </div>
    <a href="Register.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 10px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">새 앱 등록</a>
  </div>

  <div style="display: flex; flex-direction: column; border-top: 1px solid #EAEAEA">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <article style="display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center; padding: 28px 0; border-bottom: 1px solid #EAEAEA">
        <div style="flex: 1 1 280px; display: flex; align-items: center; gap: 14px; min-width: 0">
          <span style="flex: none; width: 44px; height: 44px; border-radius: 10px; background: #F2F2F2; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">{{a.glyph}}</span>
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 16px; font-weight: 600">{{a.name}}</span>
            <span style="font-size: 13px; color: #6B6B6B">{{a.meta}}</span>
          </div>
        </div>

        <ol aria-label="진행 단계" style="flex: 999 1 520px; margin: 0; padding: 0; list-style: none; display: flex; align-items: flex-start">
          <sc-for list="{{a.steps}}" as="s" hint-placeholder-count="5">
            <li style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
              <div style="display: flex; align-items: center">
                <span style="flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; background: {{s.fill}}; border: {{s.ring}}"></span>
                <span style="flex: 1; height: 2px; background: {{s.line}}; margin-left: 4px; margin-right: 4px; opacity: {{s.lineOpacity}}"></span>
              </div>
              <span style="font-size: 13px; font-weight: {{s.weight}}; color: {{s.color}}">{{s.label}}</span>
            </li>
          </sc-for>
        </ol>

        <div style="flex: 1 1 220px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right">
          <span style="font-size: 14px; font-weight: 600">{{a.status}}</span>
          <span style="font-size: 13px; color: #6B6B6B; line-height: 1.5">{{a.note}}</span>
          <a href="{{a.href}}" style="font-size: 13px; font-weight: 500">{{a.cta}}</a>
        </div>
      </article>
    </sc-for>
  </div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['신청', '플랫폼팀 검토', '보안 검증', '배포 승인', '공개'];
    const steps = (at, done) => labels.map((label, i) => {
      const isDone = done || i < at;
      const isNow = !done && i === at;
      return {
        label,
        fill: isDone ? '#111111' : '#FFFFFF',
        ring: isNow ? '2px solid #111111' : (isDone ? '0' : '1.5px solid #C4C4C4'),
        line: isDone ? '#111111' : '#DADADA',
        lineOpacity: i === labels.length - 1 ? '0' : '1',
        weight: isNow ? '600' : '400',
        color: isDone || isNow ? '#111111' : '#8A8A8A'
      };
    });
    const apps = [
      { name: '설비 예지보전', glyph: '설', meta: '2026.10.02 신청 · 대상: 제조부문', steps: steps(1), status: '플랫폼팀 검토 중', note: '실행 환경을 정하고 있습니다', cta: '신청 내용 보기', href: 'Register.dc.html' },
      { name: '품질 리포트 자동화', glyph: '품', meta: '2026.09.21 신청 · 대상: 품질혁신팀', steps: steps(2), status: '보안 검증 확인 필요', note: '점검 결과 1건을 수정해 주세요', cta: '점검 결과 보기', href: 'MyApps.dc.html' },
      { name: '설비 이상 조회', glyph: '설', meta: '2026.09.28 공개 · 대상: 제조부문', steps: steps(4, true), status: '공개됨', note: '대상 사용자가 실행할 수 있습니다', cta: '마켓에서 보기', href: 'AppDetail.dc.html' }
    ];
    return { apps };
  }
}
</script>
</body>
</html>
